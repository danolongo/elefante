# The #[ignore]d tests that need OpenRouter credentials, network, and billable requests.
#
# Manual only. These cost money on every run, so they are not attached to push or
# pull_request — a scheduled run would spend without anyone asking for it. If provider drift
# ever needs catching automatically, add a `schedule:` trigger deliberately and with a spend
# limit in mind, not as a convenience.
name: credentialed

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenRouter model slug
        required: false
        # Declares reasoning, reasoning_effort, tools and tool_choice, which
        # provider.require_parameters demands. Haiku 4.5 does not declare
        # reasoning_effort and fails routing under that flag.
        default: anthropic/claude-sonnet-5
      checks:
        description: Which checks to run
        type: choice
        options: [all, web-search]
        default: all

# One run at a time. Cancelling in flight would abandon a request already paid for, so these
# queue rather than pre-empt.
concurrency:
  group: credentialed
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  live:
    name: live provider checks
    runs-on: ubuntu-latest
    # Optional hardening once the secret exists: create a `credentialed` environment in repo
    # settings with required reviewers, then uncomment to make every run need an approval.
    # environment: credentialed
    steps:
      - uses: actions/checkout@v4
      # Pinned to match ci.yml's rust job; a floating toolchain would let an unrelated
      # Rust release break a run that costs money to repeat.
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2

      # The client starts its own executable as the daemon, so the live tests need nothing built
      # beyond their own package. Building the workspace first keeps the cache warm for both steps.
      - name: build
        run: cargo build --workspace

      # crates/provider — a second identical request must read the prompt cache. Bounded to
      # 64 output tokens by the test itself.
      - name: provider prompt cache
        if: inputs.checks == 'all'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ inputs.model }}
        run: cargo test -p elefante-provider --lib -- --ignored --nocapture

      # crates/elefante — a real edit must land in a scratch repository, and the repository index must
      # reach the model. Both run in a temp dir, not this checkout, so a model that misreads the
      # instruction cannot touch tracked files.
      # The tests bound themselves to --max-tokens 2048 --effort low and a small round limit;
      # production defaults (16k tokens, high effort) 402 on a credit-limited key for reasons
      # that have nothing to do with the code. This step also runs the memory tests: a real model
      # must name a function it can only know from the repository index it was sent, and a fact
      # stated in one session must be extracted by a real model, stored, and used in the next.
      - name: cli live edit
        if: inputs.checks == 'all'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ inputs.model }}
        run: cargo test -p elefante -- --ignored --nocapture --skip live_web_search

      # One Exa search as raw HTTP (the stream shape and cost), then one through the daemon's
      # search backend. Both use the selected model, as a session does by default.
      - name: web search
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ELEFANTE_SEARCH_MODEL: ${{ inputs.model }}
        run: |
          cargo test -p elefante-provider --test s9_web_plugin -- --ignored --nocapture
          cargo test -p elefante --lib live_web_search -- --ignored --nocapture
