[workspace]
members = [
    "crates/cli",
    "crates/core",
    "crates/guard",
    "crates/mem",
    "crates/provider",
    "crates/rpc",
    "crates/srv",
    "crates/tools",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1.0"
async-stream = "0.3"
blake3 = "1.8"
futures-util = "0.3"
getrandom = "0.4"
globset = "0.4"
ignore = "0.4"
moka = { version = "0.12", features = ["sync"] }
regex = "1.11"
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "rustls", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
